name: Release

# HACS does not need a ZIP artifact. Without releases it installs from the
# default branch; with releases it offers the five most recent plus the default
# branch, which is the only reason this workflow exists — to give installable,
# pinnable versions. Deliberately no `zip_release`: upstream shipped one and its
# published ZIP drifted a commit behind its own source, so what users installed
# was not what the repository showed. Installing from the tag keeps those
# identical by construction.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tag's ancestry can be verified below.
          fetch-depth: 0

      - name: Tag must be reachable from the default branch
        # Guards against releasing a tag from a stray branch. Note this does
        # NOT guard against the upstream v1.0.0 tags this fork inherited: those
        # commits are ancestors of main, so they pass. The test-suite check
        # below is what actually blocks them.
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not an ancestor of main; refusing to release it."
            exit 1
          fi
          echo "Tagged commit is on main."

      - name: Release must contain the test suite
        # The inherited upstream tags carry no tests, and their manifest version
        # happens to match their tag name, so neither the ancestry nor the
        # version check rejects them. This does, and it states the real rule:
        # nothing gets published that cannot be verified.
        run: |
          set -euo pipefail
          if [ ! -d tests ] || [ -z "$(ls -A tests 2>/dev/null)" ]; then
            echo "::error::No test suite at $GITHUB_REF_NAME. Refusing to publish unverifiable code."
            echo "::error::If this is an inherited upstream tag, delete it rather than releasing it."
            exit 1
          fi

      - name: Tag must match the manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(python3 -c \
            'import json; print(json.load(open("custom_components/kasa_cloud/manifest.json"))["version"])')"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest."
            echo "::error::Update custom_components/kasa_cloud/manifest.json before tagging."
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Home Assistant 2026.3+ requires Python >= 3.14.2.
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Tests must pass before publishing
        run: pytest -q

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          # No `files:` — HACS installs the source at this tag.
