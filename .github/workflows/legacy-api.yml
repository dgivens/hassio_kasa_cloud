# Its own workflow rather than a job inside Validate, because a GitHub status
# badge reflects a whole workflow. Combined with the build, the badge would say
# nothing about whether the API is still there.
name: v1 cloud API

# TP-Link has deprecated the v1 API this integration speaks. This is an early
# warning that it has been switched off, so that a dead outlet at a remote site
# is not the first sign of it.
#
# No credentials are involved. A deliberately invalid login should be rejected,
# and being rejected is what proves the API is alive and still honouring the v1
# contract.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Still answering
    runs-on: ubuntu-latest
    steps:
      - name: Probe wap.tplinkcloud.com
        run: |
          set -uo pipefail
          probe() {
            curl -sS --max-time 20 -X POST 'https://wap.tplinkcloud.com/' \
              -H 'Content-Type: application/json' \
              -d '{"method":"login","params":{"appType":"Kasa_Android",
                   "cloudUserName":"invalid@example.invalid",
                   "cloudPassword":"invalid",
                   "terminalUUID":"00000000-0000-0000-0000-000000000000"}}'
          }

          # Retry so a transient network blip is not reported as a retirement.
          for attempt in 1 2 3; do
            body="$(probe)" && [ -n "$body" ] && break
            echo "attempt $attempt failed; retrying"
            sleep 15
          done

          echo "response: $body"

          if [ -z "$body" ]; then
            echo "::error::No response from wap.tplinkcloud.com after 3 attempts."
            exit 1
          fi

          code="$(printf '%s' "$body" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("error_code","none"))' \
            2>/dev/null || echo unparseable)"

          {
            echo "### v1 cloud API probe"
            echo
            echo "Endpoint: \`https://wap.tplinkcloud.com/\`"
            echo "Response: \`$body\`"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$code" in
            -20601)
              echo "v1 API is alive and rejected the invalid login as expected."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Alive.** The invalid login was rejected with -20601, which is the expected v1 behaviour." >> "$GITHUB_STEP_SUMMARY"
              ;;
            -23003)
              echo "::error::v1 returned -23003 (app version too old). TP-Link may have retired the legacy API."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Possibly retired.** Returned -23003 (\"app version is too old\"). See [docs/v2-migration.md](../blob/main/docs/v2-migration.md)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            unparseable)
              echo "::error::Response was not JSON; the endpoint may no longer serve the v1 API."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Unexpected.** The response was not JSON, so the endpoint may no longer serve the v1 API." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              echo "::warning::Unexpected error_code $code. Not necessarily a retirement, but the v1 contract may have changed."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Changed.** Unexpected error_code \`$code\`. Not necessarily a retirement, but the v1 contract may have shifted." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
